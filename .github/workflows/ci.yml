name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (strict, lockfile-faithful)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Component tests (jest-expo)
        run: npm run test:component
      - name: Design-token gate (urafro ADR-034)
        # Every colour lives in src/theme.ts — the single Brand V1 token module
        # (this repo is public; the gate keeps forks/contributors from
        # reintroducing stray palette literals). Test files are exempt.
        run: |
          if grep -rEn '#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b' App.tsx src/ \
            --include='*.tsx' --include='*.ts' \
            | grep -v '^src/theme.ts' | grep -v '\.test\.'; then
            echo '✗ Raw colour literal outside src/theme.ts — add a role token instead.'
            exit 1
          fi
          echo '✓ All colours live in src/theme.ts.'
      - name: Contract types in sync
        # src/types/api.gen.ts is GENERATED from the vendored contract/v1.yaml. Regenerate
        # with the PINNED openapi-typescript devDep (so `npm ci` locks its output — reproducible,
        # unlike the old floating `npx`) and fail if it drifts: a hand-edit of the generated file,
        # or a vendored-contract bump without re-running `npm run gen:types`. (The tool declares a
        # typescript ^5.x peer while this app runs TS 6.x; .npmrc sets legacy-peer-deps=true and the
        # generated output is verified byte-identical regardless of the TypeScript version.)
        #
        # contract.stamp.ts is regenerated by the same script and diffed here too. It
        # carries info.version + a sha256 of the vendored bytes, which is what makes an
        # upstream change producing NO TypeScript diff (a version-only bump, a prose or
        # constraint edit) visible to this gate at all.
        run: |
          npm run gen:types
          git diff --exit-code -- src/types/api.gen.ts src/types/contract.stamp.ts \
            || { echo '✗ src/types/ generated files are stale vs contract/v1.yaml — run `npm run gen:types` and commit.'; exit 1; }
