name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install (strict, lockfile-faithful)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # NOTE: a "contract types in sync" check was tried here but openapi-typescript's
      # floating sub-deps make `npx` output non-reproducible across machines (and the
      # TS6 peer conflict blocks pinning it as a locked devDep). The committed types
      # typecheck cleanly; regenerate with `npm run gen:types` when the contract changes.
