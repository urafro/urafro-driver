openapi: 3.1.0
info:
  title: urAfro Next API
  version: "1.1.0"
  description: >
    Crowdsourced last-mile delivery platform. A monetised delivery API, live in
    production. This file is the source of truth for the `/v1` surface; the NestJS
    implementation is validated against it, and changes follow the expand/contract
    protocol in docs/contract-change-protocol.md (clients ship via EAS and cannot be
    force-updated). urafro is tenant #1 and calls the exact same API as any other
    merchant or courier org — there is no private backdoor.
  license:
    name: UNLICENSED (proprietary)

servers:
  - url: https://urafro-next.fly.dev/v1
    description: Production (Fly.io, Johannesburg)

security:
  - ApiKeyAuth: []

tags:
  - name: Deliveries
    description: Create and track delivery jobs.
  - name: Webhooks
    description: Register endpoints and receive signed delivery events.
  - name: Driver
    description: Supply-side — drivers go online, claim offered jobs, and run the lifecycle. Authenticated with a driver bearer token (not a tenant API key).

paths:
  /quotes:
    post:
      tags: [Deliveries]
      summary: Quote a delivery fare (no delivery created)
      description: >
        The cost-only fixed delivery fare for a pickup→dropoff, using the SAME engine
        `POST /deliveries` charges at intake (road distance × the region's per-km +
        base), WITHOUT creating a delivery. Lets a storefront show the customer what
        delivery will cost before they order (the buyer-app fixed-quote spine). The
        fare is cost-only and symmetric — no supply/demand/surge term — so the same
        trip quotes the same fare to anyone. Degrades to a haversine estimate when
        road routing is unavailable (`distance_source`).
      operationId: quoteFare
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, dropoff]
              properties:
                pickup:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
                dropoff:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat: { type: number, minimum: -90, maximum: 90 }
                    lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: The fixed-quote fare.
          content:
            application/json:
              schema:
                type: object
                required: [fee_minor, distance_m, distance_source, ceiling_minor, rationale]
                properties:
                  fee_minor: { type: integer, description: The fixed quote (minor units), cost-only. }
                  distance_m: { type: integer }
                  distance_source: { type: string, enum: [osrm, haversine] }
                  ceiling_minor: { type: integer, description: Fraud-guard ceiling (10× cost); never binds a real fare. }
                  rationale: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deliveries:
    post:
      tags: [Deliveries]
      summary: Create a delivery request
      description: >
        Ingests a delivery (ADR-001 §4 step 1). Idempotent via `Idempotency-Key`.
        Returns 202 with the created delivery in `pending`; matching happens
        asynchronously and progress is delivered via webhooks.
      operationId: createDelivery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryRequest' }
      responses:
        '202':
          description: Accepted — delivery created in `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Deliveries]
      summary: List deliveries (tenant-scoped)
      operationId: listDeliveries
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeliveryStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of deliveries belonging to the calling tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /deliveries/{id}:
    get:
      tags: [Deliveries]
      summary: Get a delivery by id
      operationId: getDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/cancel:
    post:
      tags: [Deliveries]
      summary: Cancel a delivery
      description: Allowed while `pending`/`assigned`; rejected once `picked_up`.
      operationId: cancelDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /deliveries/{id}/bids:
    get:
      tags: [Deliveries]
      summary: List live courier bids on an auction delivery
      description: >-
        The live sealed bids on a customer-named auction (ADR-036), for the tenant to
        relay to the customer who picks one. Price + type only — no courier reputation
        (the selection surface stays behaviour-blind: the worker-classification firewall).
      operationId: listDeliveryBids
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The live bids.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryBid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/accept-bid:
    post:
      tags: [Deliveries]
      summary: Accept a courier's bid on an auction (the customer's choice)
      description: >-
        Atomically assigns the chosen courier and locks in the agreed bid price as the
        delivery's final fare. The courier must still be available (a stale reader is a
        clean 409). Mediated by the tenant — no customer actor on the platform (ADR-029).
      operationId: acceptDeliveryBid
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bid_id]
              properties:
                bid_id: { type: string, format: uuid }
                authorize_above_max:
                  type: boolean
                  description: >-
                    The customer explicitly authorizes paying ABOVE their private max M for this
                    bid (ADR-048). When true, a bid above M is accepted by raising M to the bid
                    price (still bounded by the fraud-guard ceiling) instead of being rejected.
      responses:
        '200':
          description: Assigned to the winning courier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /cod/reconciliation:
    get:
      tags: [Deliveries]
      summary: COD reconciliation for the tenant's deliveries
      description: >
        Per-order cash-on-delivery reconciliation — for each of the tenant's COD
        deliveries (collect_minor > 0), the cash expected vs collected at the door,
        with totals. Tenant-scoped. (Platform→merchant remittance/payout is not shown
        here — that rides the deferred payout rail.)
      operationId: codReconciliation
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: delivery_id
          in: query
          required: false
          description: >
            Comma-separated delivery UUIDs to scope the reconciliation to (e.g. one merchant's own
            deliveries, joined by the core caller). When present, the id list bounds the result (no
            most-recent window) — still tenant-scoped, so ids of another tenant are ignored.
          schema: { type: string }
      responses:
        '200':
          description: COD reconciliation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CodReconciliationItem' }
                  totals:
                    type: object
                    properties:
                      count: { type: integer }
                      expected_minor: { type: integer }
                      collected_minor: { type: integer }
                      uncollected_minor: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhook-endpoints:
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: >
        Register a URL to receive delivery.* events. The signing `secret` is
        returned ONCE — store it; every event carries an
        `X-Delivery-Signature: sha256=<hmac-hex>` header over the raw JSON body.
      operationId: createWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
      responses:
        '201':
          description: Created — `secret` is shown only here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpointWithSecret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Webhooks]
      summary: List webhook endpoints (no secrets)
      operationId: listWebhookEndpoints
      responses:
        '200':
          description: This tenant's endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhook-endpoints/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      operationId: deleteWebhookEndpoint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Driver (supply side) ────────────────────────────────────────────────────
  # Onboarding (request/verify OTP) is unauthenticated; everything else is
  # authenticated with DriverBearerAuth (overrides the global ApiKeyAuth).
  /driver/auth/request-otp:
    post:
      tags: [Driver]
      summary: Request a login OTP (SMS)
      description: >
        Sends a 6-digit code to the phone via SMS. Unauthenticated (the driver has
        no token yet). Always 202 with a uniform body — never reveals whether the
        phone is known or in cooldown. Rate-limited per phone.
      operationId: driverRequestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 'E.164, e.g. +263771234567' }
      responses:
        '202':
          description: If eligible, an OTP was sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: otp_sent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /driver/auth/verify-otp:
    post:
      tags: [Driver]
      summary: Verify an OTP → driver bearer token
      description: >
        Verifies the code and returns a driver bearer token (creating the driver on
        first login). The token then authenticates every other `/v1/driver/*` call.
      operationId: driverVerifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, description: 'E.164.' }
                code: { type: string, description: 'The 6-digit code.' }
      responses:
        '200':
          description: Verified — bearer token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 'Driver bearer token — store securely; shown once.' }
                  driver_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/online:
    post:
      tags: [Driver]
      summary: Go online (available for offers)
      description: >
        Marks the authenticated driver available; optionally sets current location
        so they're immediately eligible for nearby offers. Supply both lat and lng,
        or neither.
      operationId: driverGoOnline
      security:
        - DriverBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number, format: double, minimum: -90, maximum: 90 }
                lng: { type: number, format: double, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Now available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/offline:
    post:
      tags: [Driver]
      summary: Go offline
      operationId: driverGoOffline
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Now offline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverState' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/location:
    post:
      tags: [Driver]
      summary: Push a live location ping
      operationId: driverUpdateLocation
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: double, minimum: -90, maximum: 90 }
                lng: { type: number, format: double, minimum: -180, maximum: 180 }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/offers:
    get:
      tags: [Driver]
      summary: List the driver's live job offers
      description: >
        Offered, unexpired jobs whose delivery is still pending, soonest-expiring
        first. Each item is a Delivery plus `offer_expires_at`.
      operationId: driverListOffers
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: The driver's claimable offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Offer' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/profile:
    get:
      tags: [Driver]
      summary: The driver's own profile
      description: >
        Identity + capabilities + active vehicle + derived stats in one lean
        payload (ADR-003 P0). Heavy sub-resources (vehicle CRUD, documents,
        payout methods) are their own endpoints.
      operationId: driverGetProfile
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Driver]
      summary: Update driver-editable profile fields
      description: >
        Name, preferred display name, language preference, and emergency contact.
        Phone is the OTP identity; approval/status are ops/system-owned; the
        vehicle is structured (PUT /driver/vehicles). Empty strings clear a field.
      operationId: driverUpdateProfile
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                display_name: { type: string, maxLength: 80 }
                preferred_language: { type: string, enum: [en, sn, nd] }
                emergency_contact_name: { type: string, maxLength: 120 }
                emergency_contact_phone: { type: string, maxLength: 40 }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/vehicles:
    get:
      tags: [Driver]
      summary: The driver's active vehicle
      operationId: driverGetVehicle
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: The active vehicle (or null).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/DriverVehicle' }
                      - { type: "null" }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Driver]
      summary: Set the driver's active vehicle (upsert)
      description: One active vehicle per driver; re-PUT updates it in place.
      operationId: driverPutVehicle
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [bicycle, motorbike, car, van, foot, large_truck] }
                make: { type: string, maxLength: 40 }
                model: { type: string, maxLength: 40 }
                colour: { type: string, maxLength: 30 }
                plate: { type: string, maxLength: 20 }
                year: { type: integer, minimum: 1950, maximum: 2100 }
                capacity_kg: { type: integer, minimum: 0, maximum: 100000 }
      responses:
        '200':
          description: The saved active vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverVehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/schedule:
    get:
      tags: [Driver]
      summary: The driver's weekly availability windows
      operationId: driverGetSchedule
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Availability windows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Driver]
      summary: Replace the driver's availability schedule
      description: Planned weekly hours (ADR-003 P4) — informational, not a hard go-online lock.
      operationId: driverSetSchedule
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windows]
              properties:
                windows:
                  type: array
                  maxItems: 50
                  items: { $ref: '#/components/schemas/ScheduleWindow' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/documents:
    get:
      tags: [Driver]
      summary: Per-requirement verification status
      operationId: driverListDocuments
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: One entry per requirement type.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DriverRequirement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/documents/{type}/upload-url:
    post:
      tags: [Driver]
      summary: Begin a document submission (presigned upload)
      description: >
        Returns a short-lived presigned PUT URL; the client uploads the file
        bytes to object storage directly, then calls /driver/documents/confirm.
        503 if storage is not configured.
      operationId: driverDocumentUploadUrl
      security:
        - DriverBearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [identity_id, profile_photo, drivers_licence, vehicle_registration] }
      responses:
        '201':
          description: Presigned upload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignedUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Document storage is not configured. }

  /driver/documents/confirm:
    post:
      tags: [Driver]
      summary: Confirm a document upload completed
      operationId: driverConfirmDocument
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id: { type: string, format: uuid }
      responses:
        '204': { description: Confirmed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/documents/terms:
    post:
      tags: [Driver]
      summary: Accept the current terms (attestation)
      operationId: driverAcceptTerms
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, maxLength: 40 }
      responses:
        '204': { description: Accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/payout-methods:
    get:
      tags: [Driver]
      summary: The driver's payout methods
      operationId: driverListPayoutMethods
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Payout methods (masked).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PayoutMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Driver]
      summary: Add a payout method
      description: The account reference is encrypted server-side; 503 if payouts are not configured.
      operationId: driverAddPayoutMethod
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, account_ref, holder_name]
              properties:
                kind: { type: string, enum: [ecocash, bank] }
                account_ref: { type: string, minLength: 4, maxLength: 40 }
                holder_name: { type: string, minLength: 2, maxLength: 120 }
                bank_name: { type: string, maxLength: 80 }
      responses:
        '201':
          description: The saved method (masked).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Payouts are not configured. }

  /driver/payout-methods/{id}/default:
    post:
      tags: [Driver]
      summary: Make a payout method the default
      operationId: driverSetDefaultPayoutMethod
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Default updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deliveries/{id}/rating:
    post:
      tags: [Deliveries]
      summary: Rate the driver of a completed delivery (tenant → driver)
      description: 1–5 stars + optional comment, for the tenant's own delivered job. Feeds driver reputation. One per delivery; re-rating overwrites (ADR-003 P3).
      operationId: rateDelivery
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '204': { description: Rated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/deliveries:
    get:
      tags: [Driver]
      summary: The driver's job history
      description: >
        Newest first — the Jobs tab. Public delivery shape plus `driver_fee_minor`
        and per-job facts (`pod_method`, `delivered_at`, `cod_collected_minor`);
        contacts are deliberately absent (stale customer PII on past jobs). Money
        aggregates (payable, COD owed) live in /driver/earnings. Cursor-paginated:
        pass the previous page's `next_before` back as `before` to load older jobs.
      operationId: driverListDeliveries
      security:
        - DriverBearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          required: false
          description: >
            Opaque pagination cursor — pass the previous page's `next_before`
            verbatim to load older jobs. (Internally `<updated_at>|<id>`; treat as
            opaque.) A malformed cursor returns the first page.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Filter to a single delivery status (e.g. delivered, failed).
          schema: { type: string }
      responses:
        '200':
          description: Job history page.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_before]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Delivery'
                        - type: object
                          properties:
                            driver_fee_minor: { type: [integer, "null"] }
                            pod_method:
                              type: [string, "null"]
                              enum: [photo, signature, otp, manual, null]
                              description: How the handover was confirmed (delivered jobs).
                            delivered_at:
                              type: [string, "null"]
                              format: date-time
                              description: Completion time (PoD geostamp); null unless delivered.
                            cod_collected_minor:
                              type: [integer, "null"]
                              description: Cash actually collected on this run (vs collect_minor due).
                  next_before:
                    type: [string, "null"]
                    description: >
                      Opaque cursor for the next (older) page — pass it back as
                      `before`. Null when there are no more jobs.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/offers/{id}/decline:
    post:
      tags: [Driver]
      summary: Decline an offer
      description: >
        Marks this driver's live offer declined — it is never re-offered to them.
        Idempotent; declining a lapsed/claimed offer is a harmless no-op.
      operationId: driverDeclineOffer
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Declined (or already moot). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/offers/{id}/reset:
    post:
      tags: [Driver]
      summary: Reset (extend) an offer countdown once
      description: >
        Gophr-parity resettable timer. Pushes this driver's OWN live offer countdown
        forward once, with no acceptance-rate penalty. Only a still-offered, unexpired,
        never-reset offer qualifies; anything else (already reset, lapsed, claimed, or
        not this driver's) returns 409. `id` is the delivery id.
      operationId: driverResetOffer
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Offer countdown reset; returns the new expiry.
          content:
            application/json:
              schema:
                type: object
                required: [offer_expires_at]
                properties:
                  offer_expires_at: { type: string, format: date-time }
        '409': { description: The offer cannot be reset (already reset, lapsed, or claimed). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/board:
    get:
      tags: [Driver]
      summary: The open job board (coarse, PII-scoped)
      description: >
        H1. The pending deliveries a VERIFIED driver could grab, as COARSE cards
        only — distance-to-pickup, the driver's cut, and COD y/n. NO exact address,
        landmark, or contact pre-claim; full detail is revealed only on claim. Flag +
        supply gated: an empty list when the board is off or the driver is unverified.
        Bounded to the 50 most recent pending jobs.
      operationId: driverBoard
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Coarse open-board cards (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [delivery_id, driver_fee_minor, cod]
                      properties:
                        delivery_id: { type: string, format: uuid }
                        pickup_distance_km: { type: [number, "null"], description: "Straight-line km to pickup from the driver's last position; null if unknown." }
                        driver_fee_minor: { type: integer, description: The driver's cut (minor units). }
                        cod: { type: boolean, description: Whether the job carries cash-on-delivery. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/earnings:
    get:
      tags: [Driver]
      summary: The driver's earnings summary
      description: >
        All-time accrued payable balance (credits − debits on the driver_payable
        ledger account) plus today's earnings, where "today" is the Africa/Harare
        local day. Amounts are minor units.
      operationId: driverEarnings
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Earnings summary.
          content:
            application/json:
              schema:
                type: object
                required: [payable_minor, today_minor, today_deliveries, cod_owed_minor, referral_earned_minor, currency]
                properties:
                  payable_minor: { type: integer }
                  today_minor: { type: integer }
                  today_deliveries: { type: integer }
                  cod_owed_minor:
                    type: integer
                    description: COD cash float currently in the driver's hands, owed onward.
                  referral_earned_minor:
                    type: integer
                    description: Unpaid two-sided referral credit owed to this driver (ADR-041); 0 while the reward is dark.
                  currency: { type: string, example: USD }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/referrals:
    get:
      tags: [Driver]
      summary: The driver's referral code + stats
      description: >
        The driver's own shareable referral code (minted on first read), how many
        drivers have applied it, the current per-side reward, and any unpaid referral
        credit owed to them (ADR-041 two-sided referral).
      operationId: driverReferrals
      security:
        - DriverBearerAuth: []
      responses:
        '200':
          description: Referral summary.
          content:
            application/json:
              schema:
                type: object
                required: [code, referred_count, reward_minor, referral_earned_minor]
                properties:
                  code: { type: string, description: The driver's shareable referral code. }
                  referred_count: { type: integer, description: Drivers who have applied this code. }
                  reward_minor: { type: integer, description: Current per-side reward (REFERRAL_REWARD_MINOR; 0 = dark). }
                  referral_earned_minor: { type: integer, description: Unpaid referral credit owed to this driver. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/referrals/apply:
    post:
      tags: [Driver]
      summary: Apply a referrer's code
      description: >
        A new driver claims who referred them. Allowed ONLY before they verify (the
        reward fires on their own verification) and only once; self-referral and unknown
        codes are rejected.
      operationId: driverApplyReferral
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4, maxLength: 16 }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [applied]
                properties:
                  applied: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/push-token:
    post:
      tags: [Driver]
      summary: Register this device's push token
      description: >
        Upserts an Expo push token for the authenticated driver, keyed on the
        token — on a shared phone the device follows whoever logged in last.
        Push is advisory (offer/cancel wake-ups); the offers list remains the
        source of truth.
      operationId: driverRegisterPushToken
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, maxLength: 200 }
                platform: { type: string, enum: [android, ios] }
      responses:
        '204': { description: Registered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Driver]
      summary: Remove this device's push token (logout hygiene)
      operationId: driverRemovePushToken
      security:
        - DriverBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 200 }
      responses:
        '204': { description: Removed (idempotent). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /driver/deliveries/{id}:
    get:
      tags: [Driver]
      summary: Get the driver's assigned job
      operationId: driverGetDelivery
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The delivery — only if assigned to this driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/deliveries/{id}/rating:
    post:
      tags: [Driver]
      summary: Rate a completed delivery (driver → tenant)
      description: 1–5 stars + optional comment, for a delivered job. One per delivery; re-rating overwrites (ADR-003 P3).
      operationId: driverRateDelivery
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '204': { description: Rated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/deliveries/{id}/claim:
    post:
      tags: [Driver]
      summary: Claim an offered job
      description: Atomic — exactly one driver wins a contested offer; losers get 409.
      operationId: driverClaimDelivery
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Claimed — now `assigned` to this driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/bid:
    post:
      tags: [Driver]
      summary: Bid on a customer-named auction job (ADR-036)
      description: >-
        Submit a sealed bid on an auction this driver was offered — ACCEPT@opening or a
        COUNTER (rejected above the delivery's 10× ceiling). The auction path replaces
        /claim for auction deliveries; a courier sees only their own bid.
      operationId: driverSubmitBid
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [accept, counter] }
                price_minor:
                  type: integer
                  minimum: 1
                  description: Required for a counter (the courier's price); ignored for accept.
      responses:
        '200':
          description: The submitted bid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryBid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/picked_up:
    post:
      tags: [Driver]
      summary: Mark the job picked up
      operationId: driverMarkPickedUp
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Now `picked_up`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/in_transit:
    post:
      tags: [Driver]
      summary: Mark the job in transit
      operationId: driverMarkInTransit
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Now `in_transit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/delivered:
    post:
      tags: [Driver]
      summary: Mark the job delivered (+ proof of delivery)
      description: >
        Completes the delivery: records proof-of-delivery, accrues the driver
        earning, meters the billable `delivery.completed`, and frees the driver.
      operationId: driverMarkDelivered
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProofOfDelivery' }
      responses:
        '200':
          description: Now `delivered`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/failed:
    post:
      tags: [Driver]
      summary: Mark the job failed
      operationId: driverMarkFailed
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  $ref: '#/components/schemas/FailureReason'
      responses:
        '200':
          description: Now `failed`; the driver is freed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/message:
    post:
      tags: [Driver]
      summary: Send the recipient a fixed coordination SMS
      description: >
        Send the delivery recipient one of a fixed set of operational coordination
        messages (arriving / running late / can't find the address / have COD ready)
        over SMS, carrying the tracking link. Only the assigned courier, only while the
        job is active. There is no free-form body — the template is whitelisted. The
        SMS is advisory: a missing recipient phone (or the recipient-SMS cost gate
        being off) returns `{ "sent": false, "reason": ... }` rather than an error.
      operationId: driverSendMessage
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
                  enum: [arriving, running_late, cant_find, cod_reminder]
      responses:
        '200':
          description: Processed. `sent` indicates whether an SMS actually went out.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
                  reason:
                    type: string
                    enum: [disabled, no_recipient_phone, send_failed]
                    description: Present only when `sent` is false.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/deliveries/{id}/pod-photo-url:
    post:
      tags: [Driver]
      summary: Get a presigned URL to upload a proof-of-delivery photo
      description: >
        Mint a short-lived presigned PUT URL so the assigned courier uploads a
        proof-of-delivery photo directly to private object storage (bytes never touch
        this API — same pattern as KYC documents). The key is deterministic per
        delivery; after uploading, the courier completes the job with
        `method: photo` and the tenant read then exposes a signed `pod_photo_url`.
        Only the assigned courier, only while the job is active. Returns 503 when
        photo storage is not configured.
      operationId: driverPodPhotoUploadUrl
      security:
        - DriverBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Presigned upload for the PoD photo.
          content:
            application/json:
              schema:
                type: object
                required: [storage_key, upload]
                properties:
                  storage_key: { type: string }
                  upload:
                    type: object
                    required: [url, method, expires_in]
                    properties:
                      url: { type: string }
                      method: { type: string, enum: [PUT] }
                      expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Photo storage is not configured.

# OpenAPI 3.1 webhooks — events the platform POSTs to a tenant's registered URL.
# All are HMAC-signed (X-Delivery-Signature); tenants verify with their secret.
webhooks:
  deliveryEvent:
    post:
      summary: Delivery lifecycle event
      operationId: onDeliveryEvent
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEvent' }
      responses:
        '2XX':
          description: Acknowledged. Non-2xx (or timeout) triggers signed retries with backoff.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Per-tenant API key (hashed + peppered at rest). Resolves the tenant + scopes.
    DriverBearerAuth:
      type: http
      scheme: bearer
      description: >
        Driver bearer token (hashed + peppered at rest), issued at provisioning or
        after OTP onboarding. Authenticates `/v1/driver/*`. Distinct from the
        tenant X-Api-Key — drivers are supply, not tenants.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: Replaying the same key returns the original delivery instead of creating a duplicate.

  schemas:
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          properties:
            secret:
              type: string
              description: Shown once at creation. Verify the X-Delivery-Signature with it.

    # ── KEYSTONE (ADR-001 §2/§3) ──────────────────────────────────────────────
    # Built for informal addressing: a GPS pin is authoritative, free text is a
    # fallback, and `source` records how the pin was obtained. urafro (and every
    # tenant) must produce THIS shape — see ADR-001 for the urafro punch-list.
    GeoLocation:
      type: object
      required: [lat, lng, source]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        source:
          type: string
          enum: [whatsapp_share, map_pin, text_only]
          description: How the pin was captured. `text_only` = no reliable pin (degraded).
        landmark:
          type: string
          maxLength: 280
          description: Human directions — "blue gate opposite the borehole". Critical in informal areas.
        address_text:
          type: string
          maxLength: 280
          description: Optional free-text address (legacy / fallback).
        shared_at:
          type: string
          format: date-time
          description: When the pin was captured (staleness matters for moving customers).

    Contact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 120 }
        phone:
          type: string
          description: E.164 (e.g. +263...). Used for driver↔customer coordination.

    Package:
      type: object
      properties:
        description: { type: string, maxLength: 280 }
        size:
          type: string
          enum: [envelope, small, medium, large]
          default: small
        value_minor:
          type: integer
          description: Declared value in minor currency units (cents). Optional.
        weight_grams:
          type: integer
          minimum: 0
          description: >-
            Package weight in grams (R2). Matched against the driver vehicle's rated
            capacity_kg in dispatch. Optional — absent/null = unmeasured, no weight
            constraint.

    DeliveryRequest:
      type: object
      required: [pickup, pickup_contact, dropoff, dropoff_contact]
      properties:
        external_ref:
          type: string
          maxLength: 120
          description: The tenant's own order id (e.g. urafro order code) for correlation.
        pickup: { $ref: '#/components/schemas/GeoLocation' }
        pickup_contact: { $ref: '#/components/schemas/Contact' }
        dropoff: { $ref: '#/components/schemas/GeoLocation' }
        dropoff_contact: { $ref: '#/components/schemas/Contact' }
        package: { $ref: '#/components/schemas/Package' }
        notes: { type: string, maxLength: 500 }
        collect_minor:
          type: integer
          minimum: 0
          description: >-
            Cash-on-delivery amount in minor units (cents) the driver collects from
            the recipient on the merchant's behalf. Distinct from the platform
            delivery fee (`fee_minor`). Omit for prepaid orders.
        opening_price_minor:
          type: integer
          minimum: 1
          description: >-
            Customer-named opening price (minor units) for a fare AUCTION (ADR-036). When
            set, the delivery is an auction: `fee_minor` stays the cost-only advisory,
            couriers ACCEPT@this or counter (≤ 10× the advisory), and the tenant accepts
            one via `/deliveries/{id}/accept-bid`. Omit for a fixed-price delivery.
        max_price_minor:
          type: integer
          minimum: 1
          description: >-
            Buyer's pre-authorized MAX fare (minor units) for an auction (ADR-045). The
            auction auto-clears the cheapest bid ≤ this without the buyer present, so the
            job still clears in thin supply. Only meaningful with opening_price_minor;
            clamped server-side to [opening_price_minor, ceiling_minor]. The buyer's max
            is private — it is never echoed back on the Delivery (a courier who saw it
            would counter exactly at it).
        dispatch_policy:
          type: string
          enum: [open, fleet_first, fleet_only]
          description: >-
            Which drivers to offer this delivery to (Epic B). `open` (default) — the whole
            pool; `fleet_first` — the tenant's `preferred_fleet_id` first for a short window,
            then widen to the pool; `fleet_only` — that fleet only (never widens). Requires
            `preferred_fleet_id` for the fleet_* policies. This is the "favourite courier
            sees it first" control.
        preferred_fleet_id:
          type: string
          format: uuid
          description: A fleet (owned by this tenant) to prefer under `dispatch_policy`.

    DeliveryStatus:
      type: string
      enum: [pending, assigned, picked_up, in_transit, delivered, failed, unassigned, cancelled]

    DeliveryBid:
      type: object
      properties:
        id: { type: string, format: uuid }
        price_minor:
          type: integer
          description: The bid price (minor units) — ACCEPT@opening, or the courier's counter.
        bid_type: { type: string, enum: [accept, counter] }
        expires_at: { type: string, format: date-time }

    # Per-order COD reconciliation row (the GET /v1/cod/reconciliation `items[]`). Named
    # so consumers (urafro core's /cod money view) can codegen it instead of hand-mirroring
    # the shape — the inline definition drifted silently before.
    CodReconciliationItem:
      type: object
      properties:
        delivery_id: { type: string, format: uuid }
        external_ref: { type: [string, "null"] }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        expected_minor:
          type: integer
          description: Full door COD the courier collects on this delivery (goods + the delivery fee).
        collected_minor:
          type: integer
          description: What the courier has actually collected at the door so far (0 until delivered).
        updated_at: { type: string, format: date-time }

    Driver:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        # A driver is either in the open crowdsourced pool or belongs to a
        # courier-org tenant (ADR-001 §2 supply model).
        courier_org_id: { type: [string, "null"], format: uuid }

    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        external_ref: { type: string }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        pickup: { $ref: '#/components/schemas/GeoLocation' }
        dropoff: { $ref: '#/components/schemas/GeoLocation' }
        trip_km:
          type: [number, "null"]
          description: >-
            Straight-line pickup→dropoff distance in km (1 dp) — the SAME
            haversine the fee uses, not road distance. Driver UIs present it as
            approximate ("~7.8 km"). Null if either coordinate is missing.
        driver:
          oneOf:
            - { $ref: '#/components/schemas/Driver' }
            - { type: "null" }
        fee_minor:
          type: [integer, "null"]
          description: >-
            Platform delivery fee in minor units, quoted at creation from the
            pickup→dropoff distance (base + per-km, clamped). The driver earns a
            configured share of this on completion; the platform keeps the rest.
        collect_minor:
          type: [integer, "null"]
          description: Cash-on-delivery amount (minor units); null = prepaid / nothing to collect.
        opening_price_minor:
          type: [integer, "null"]
          description: >-
            Customer-named opening price (minor units) when this is an AUCTION (ADR-036);
            null on a fixed-price delivery. The offered courier ACCEPTs or COUNTERs against it.
        ceiling_minor:
          type: [integer, "null"]
          description: >-
            Fraud-guard ceiling (minor units, 10× the cost estimate) a courier's COUNTER may not
            exceed on an auction (ADR-036); null on a fixed-price delivery. NOT a price band — the
            buyer's private auto-accept max is never exposed here.
        final_price_minor:
          type: [integer, "null"]
          description: >-
            The agreed fare (minor units) once a courier's bid is accepted on an auction;
            settlement splits this (not `fee_minor`). Null until a bid clears.
        failure_reason:
          oneOf:
            - { $ref: '#/components/schemas/FailureReason' }
            - { type: "null" }
          description: Why the driver marked it failed; null unless status is `failed`.
        pod_pin:
          type: [string, "null"]
          pattern: '^\d{4}$'
          description: >-
            At-door proof-of-delivery PIN, generated at intake. **Tenant surfaces
            only** (create response, GET, list) — relay it to the recipient; it is
            never present in driver payloads or webhook bodies. The driver submits
            it on delivered for a verified (`otp`) handover.
        pod_photo_url:
          type: [string, "null"]
          description: >-
            A short-lived (≈2 min) signed URL to view the proof-of-delivery PHOTO,
            present when the job was completed with `method: photo`. **Tenant surfaces
            only**; minted fresh on each read (never cached — it expires fast) and only
            for the owning tenant. Null when there is no photo PoD on this delivery.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FailureReason:
      type: string
      enum: [customer_unreachable, wrong_address, customer_refused, cash_refused, vehicle_problem, other]

    DriverState:
      type: object
      properties:
        driver_id: { type: string, format: uuid }
        status:
          type: string
          enum: [available, offline, busy]

    # ADR-003 driver-profile schemas (P0).
    DriverCapabilities:
      type: object
      description: >-
        Computed gates the app renders affordances off — never a single flag.
        P0 derives can_go_online from approval; later phases add payouts/COD.
      required: [can_go_online, can_receive_payouts, can_handle_high_value_cod]
      properties:
        can_go_online: { type: boolean }
        can_receive_payouts: { type: boolean }
        can_handle_high_value_cod: { type: boolean }

    DriverVehicle:
      type: object
      description: The driver's structured active vehicle (ADR-003 P0).
      required: [id, type]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [bicycle, motorbike, car, van, foot, large_truck] }
        make: { type: [string, "null"] }
        model: { type: [string, "null"] }
        colour: { type: [string, "null"] }
        plate: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        capacity_kg: { type: [integer, "null"] }

    DriverStats:
      type: object
      description: >-
        Derived reputation/performance (ADR-003 P0). Rates are null until there is
        a denominator (so UIs show "New", not a fake 0%). Ratings populate in P3.
      required: [lifetime_jobs, completed_jobs, failed_jobs, offered_count, accepted_count, rating_count, completion_rate, acceptance_rate, rating_avg]
      properties:
        lifetime_jobs: { type: integer }
        completed_jobs: { type: integer }
        failed_jobs: { type: integer }
        offered_count: { type: integer }
        accepted_count: { type: integer }
        rating_count: { type: integer }
        completion_rate: { type: [number, "null"] }
        acceptance_rate: { type: [number, "null"] }
        rating_avg: { type: [number, "null"] }

    DriverProfile:
      type: object
      description: The driver's own composed profile (ADR-003 P0/P1).
      required: [driver_id, name, phone, verification_status, kyc_tier, cod_cap_minor, cod_outstanding_minor, cod_headroom_minor, status, preferred_language, member_since, capabilities, stats]
      properties:
        driver_id: { type: string, format: uuid }
        name: { type: string }
        display_name: { type: [string, "null"] }
        phone: { type: string }
        verification_status:
          type: string
          enum: [unverified, in_review, verified, suspended, banned]
          description: The verification state machine (ADR-003 P1); only `verified` can go on shift.
        kyc_tier:
          type: integer
          description: 0 none · 1 identity verified · 2 identity + licence (gates payouts/high-value COD).
        cod_cap_minor:
          type: integer
          description: >-
            The driver's collateral-backed COD cash limit (minor units) =
            min(⅓·vehicle estimated value, KYC-tier ceiling, ops override). 0 until
            ops value a vehicle — an unvalued driver can't carry COD (ADR-002 §10 / C1).
        cod_outstanding_minor:
          type: integer
          description: COD cash the driver currently holds and owes onward (minor units) (C2).
        cod_headroom_minor:
          type: integer
          description: Remaining COD the driver can still accept = max(0, cap − outstanding) (C8).
        status: { type: string, enum: [available, offline, busy] }
        preferred_language: { type: string, enum: [en, sn, nd] }
        emergency_contact:
          oneOf:
            - type: object
              properties:
                name: { type: [string, "null"] }
                phone: { type: [string, "null"] }
            - { type: "null" }
        member_since: { type: string, format: date-time }
        zone:
          description: The driver's service zone (ADR-003 P4), or null for the open pool.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - { type: "null" }
        capabilities: { $ref: '#/components/schemas/DriverCapabilities' }
        vehicle:
          oneOf:
            - { $ref: '#/components/schemas/DriverVehicle' }
            - { type: "null" }
        vehicle_label: { type: [string, "null"] }
        stats: { $ref: '#/components/schemas/DriverStats' }

    DriverRequirement:
      type: object
      description: Per-requirement verification status for the driver's own view (ADR-003 P1; no file URLs — KYC PII stays ops-only).
      required: [type, status]
      properties:
        type:
          type: string
          enum: [identity_id, profile_photo, drivers_licence, vehicle_registration, terms]
        status:
          type: string
          enum: [not_submitted, pending_review, approved, rejected, expired]
        uploaded_at: { type: [string, "null"], format: date-time }
        review_reason: { type: [string, "null"] }

    PresignedUpload:
      type: object
      description: A short-lived URL to PUT a document's bytes directly to object storage (ADR-003 P1).
      required: [document_id, storage_key, upload]
      properties:
        document_id: { type: string, format: uuid }
        storage_key: { type: string }
        upload:
          type: object
          required: [url, method, expires_in]
          properties:
            url: { type: string }
            method: { type: string, enum: [PUT] }
            expires_in: { type: integer }

    ScheduleWindow:
      type: object
      description: A weekly availability window in local minutes-of-day (ADR-003 P4).
      required: [day_of_week, start_minute, end_minute]
      properties:
        day_of_week: { type: integer, minimum: 0, maximum: 6, description: 0=Sun … 6=Sat }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 1, maximum: 1440 }

    PayoutMethod:
      type: object
      description: A driver payout method (ADR-003 P2). The full account reference is encrypted server-side — only a masked tail is ever returned.
      required: [id, kind, account_ref_mask, holder_name, is_default]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [ecocash, bank] }
        account_ref_mask: { type: string, example: "•••• 1219" }
        holder_name: { type: string }
        bank_name: { type: [string, "null"] }
        is_default: { type: boolean }
        verified_at: { type: [string, "null"], format: date-time }

    Offer:
      allOf:
        - $ref: '#/components/schemas/Delivery'
        - type: object
          properties:
            offer_expires_at:
              type: string
              format: date-time
              description: When this offer lapses; claim before then or it's withdrawn.
            driver_fee_minor:
              type: [integer, "null"]
              description: >-
                The DRIVER'S share of the fee in minor units — what driver-facing
                UIs must quote (never the full fee_minor).
            pickup_distance_km:
              type: [number, "null"]
              description: >-
                Straight-line distance in km (1 dp) from the driver's last known
                location to the pickup — how far they'd travel to start the run
                (ADR-002 Phase B "distance-to-pickup"). Straight-line, not road
                distance. Null if the driver's position is unknown.

    DriverDelivery:
      description: >-
        A delivery as seen by its **assigned driver** — the public Delivery plus the
        contacts needed to coordinate the run and the driver's own cut of the fee.
        Returned only on the driver's own endpoints after claiming; contacts never
        appear in tenant, offer, or webhook payloads.
      allOf:
        - $ref: '#/components/schemas/Delivery'
        - type: object
          properties:
            pickup_contact: { $ref: '#/components/schemas/Contact' }
            dropoff_contact: { $ref: '#/components/schemas/Contact' }
            driver_fee_minor:
              type: [integer, "null"]
              description: >-
                The DRIVER'S share of the fee in minor units — what driver-facing
                UIs must quote (never the full fee_minor).

    ProofOfDelivery:
      type: object
      properties:
        method:
          type: string
          enum: [photo, signature, otp, manual]
          default: manual
          description: How delivery was proven. Capture UX (photo / at-door OTP) is a later phase.
        note: { type: string, maxLength: 500 }
        cod_collected_minor:
          type: integer
          minimum: 0
          description: >-
            What the driver actually collected on a COD job (minor units). Omit to
            book the delivery's full collect_minor; explicit 0 books nothing —
            the COD ledger records reality and reconciliation surfaces shortfalls.
        pod_pin:
          type: string
          pattern: '^\d{4}$'
          description: >-
            The at-door PIN read out by the recipient. Optional — manual remains
            the fallback. A match upgrades the PoD method to `otp`; a mismatch
            rejects the completion (400), capped at 5 attempts per delivery.

    WebhookEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - delivery.created
            - delivery.assigned
            - delivery.picked_up
            - delivery.in_transit
            - delivery.completed
            - delivery.failed
            - delivery.unassigned
            - delivery.cancelled
            - delivery.auction_reverted  # ADR-036 T3: a no-clear customer-named auction reverted to a fixed-price delivery (fee_minor now the standard fare)
            - eta.updated
            - bid.updated
        created_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            delivery: { $ref: '#/components/schemas/Delivery' }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing/invalid API key.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (or not visible to this tenant).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated, but not allowed (e.g. not the assigned driver).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State conflict (e.g. cancelling an already-picked-up delivery).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Valid shape but unusable (e.g. dropoff has source=text_only and no usable pin).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
